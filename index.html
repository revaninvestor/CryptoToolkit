<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoToolkit</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 430px;
  background: #1b2030;
  padding: 28px;
  border-radius: 18px;
}
h1 { color: #8b9cff; }
p { color: #aab2c5; }
input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #414b66;
  border-radius: 9px;
  background: #10131c;
  color: white;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #6578ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.result {
  margin-top: 22px;
  font-size: 23px;
  font-weight: bold;
}
#price { color: #72e6a1; }
</style>
</head>
<body>
<div class="container">
  <h1>CryptoToolkit 🚀</h1>
  <p>Simple tools for crypto users.</p>

  <h3>Live Ethereum Price</h3>
  <div id="price">Loading price...</div>

  <h3>ETH to USD Calculator</h3>
  <input id="eth" type="number" placeholder="Enter ETH amount" min="0" step="any">
  <button onclick="convert()">Convert to USD</button>
  <div class="result" id="result">$0.00</div>
  <p>Powered by CryptoToolkit</p>
</div>

<script>
let ethPrice = 0;

async function getPrice() {
  try {
    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd"
    );
    if (!response.ok) throw new Error("Price unavailable");
    const data = await response.json();
    ethPrice = data.ethereum.usd;
    document.getElementById("price").textContent =
      "$" + ethPrice.toLocaleString("en-US");
    convert();
  } catch (error) {
    document.getElementById("price").textContent =
      "Price currently unavailable";
  }
}

function convert() {
  const amount = Number(document.getElementById("eth").value);
  if (!Number.isFinite(amount) || amount < 0) {
    document.getElementById("result").textContent = "Enter a valid amount";
    return;
  }
  if (ethPrice <= 0) {
    document.getElementById("result").textContent = "Price not loaded yet";
    return;
  }
  const total = amount * ethPrice;
  document.getElementById("result").textContent =
    "$" + total.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
}

getPrice();
</script>
</body>
</html>
